[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chroma-db-import"
version = "0.1.0"
description = "Import processed podcast RAG caches into Chroma and produce chat metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chroma_db_import = ["prompts/*.txt", "desktop/assets/*", "desktop/assets/assets/*"]

[project.scripts]
chroma-db-import = "chroma_db_import.cli:main"
chroma-corpus-release = "chroma_db_import.release_cli:main"
chroma-import-hardening = "chroma_db_import.hardening:main"
